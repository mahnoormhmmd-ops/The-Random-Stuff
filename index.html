<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="view port" content="width=device-width, initial scale=1.0" />
    <title>The Ultimate Website</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="start-screen" id="start-screen">
        <h1>Quiz Time!</h1>
        <p>I know you are very intelligent, but lets put that to a test!</p>
        <button class="start-btn" id="start-btn">Start Testing!</button>
      </div>

      <div class="quiz screen" id="quiz">
        <div class="quiz-header">
          <h2 id="question-text">Question will be here?</h2>
          <div class="question-info">
            <p>
              Question <span id="current-question">1</span> of <span>5</span>
            </p>
            <p>Score: <span id="score">0</span></p>
          </div>
        </div>
        <div id="answers-container" class="answers-container">
            <!--The answers will be inserted here from our javascript-->
        </div>
        <div class="progress-bar">
            <div id="progress" class="progress"></div>
        </div>
      </div>
      <div id="result-screen" class="screen">
        <h1>Quiz Results</h1>
        <div class="result-info">
            <p>You scored <span id="final-score">0</span> out of <span id="maximum-score">5</span></p>
            <div id="result-message">
                <p>Good Job!</p>
            </div>
        </div>
        <button id="restart-btn">Restart Quiz</button>
      </div>
    </div>
  </body>
</html>
